[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-idp"
version = "0.1.0"
description = "A tiny OpenID Connect identity provider for local development and CI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
  "Flask==3.1.3",
  "PyJWT==2.15.1",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "requests==2.34.2",
  "Authlib==1.9.1",
  "joserfc==1.7.7",
]

[project.scripts]
mock-idp = "mock_idp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mock_idp = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: pure functions and small classes, no HTTP (tests/unit)",
  "api: the Flask test client, in process (tests/api)",
  "e2e: real HTTP against a served app (tests/e2e)",
]
