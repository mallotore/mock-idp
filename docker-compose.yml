services:
  mock-idp:
    build:
      context: .
      target: runtime
    environment:
      MOCK_IDP_ISSUER: ${MOCK_IDP_ISSUER:-http://127.0.0.1:8081}
      MOCK_IDP_PUBLIC_URL: ${MOCK_IDP_PUBLIC_URL:-http://127.0.0.1:8081}
      MOCK_IDP_USERS_FILE: /config/users.json
    volumes:
      - ./config:/config:ro
    ports:
      - "127.0.0.1:8081:8081"

  lint:
    profiles: ["test"]
    build:
      context: .
      target: lint

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
